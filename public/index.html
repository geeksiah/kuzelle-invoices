<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kuzelle">
<meta name="robots" content="noindex, nofollow">
<title>Kuzelle</title>
<script>
/* Apply the saved theme before first paint so there is no flash. */
try{var t=(JSON.parse(localStorage.getItem('kuzelle.ui.v1'))||{}).theme||'system';
if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..750&family=Fraunces:opsz,wght@9..144,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="js/app.js">
</head>
<body>

<div id="lock">
  <button class="icon-btn lock-theme" data-act="toggle-theme" aria-label="Switch theme"></button>
  <div class="lock-inner">
    <img class="lock-logo brand-ink" id="lock-logo" alt="Kuzelle">
    <h1>Enter access code</h1>
    <div class="lock-msg" id="lock-msg" aria-live="polite">Invoices and receipts</div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="print-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<noscript>Kuzelle needs JavaScript to run.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
